<script>
const $=(s,r=document)=>r.querySelector(s);
const el=(t,p={},...k)=>{const e=document.createElement(t);for(const[a,v]of Object.entries(p)){if(a==='class')e.className=v;else if(a.startsWith('on'))e[a]=v;else e.setAttribute(a,v)}k.flat().forEach(c=>e.append(c));return e};
async function api(path,method='GET',body){
  const r=await fetch('/api/'+path,{method,headers:body?{'content-type':'application/json'}:{},body:body?JSON.stringify(body):undefined,credentials:'same-origin'});
  let d={};try{d=await r.json()}catch{}
  if(!r.ok)throw new Error(d.error||'Ошибка');return d}
const fmt=t=>new Date(t).toLocaleDateString('ru-RU');
let me=null,tab='news',cfg=null,unread=0,timer=null;
const imgUrl=id=>'/api/img?id='+id;
function avatarEl(id,size,name){
  if(id)return el('img',{class:'av',src:imgUrl(id),width:size,height:size,style:`width:${size}px;height:${size}px`,alt:''});
  const d=el('span',{class:'av',style:`width:${size}px;height:${size}px;font-size:${Math.round(size*.5)}px`},(name||'?')[0].toUpperCase());return d}
function nameEl(u,size=0){
  const s=el('span',{class:'nm'});
  if(size)s.append(avatarEl(u.avatar,size,u.username));
  if(u.badge){if(String(u.badge).startsWith('sticker:'))s.append(el('img',{class:'nick-sticker',src:imgUrl(String(u.badge).slice(8)),alt:'Стикер ника',loading:'lazy'}));else s.append(el('span',{},u.badge))}
  const n=el('span',{},u.username);if(u.color)n.style.color=u.color;s.append(n);return s}
async function init(){
  try{cfg=await api('config')}catch{cfg={donates:{},colors:[],badges:[],price:{},reward:{}}}
  try{me=(await api('me')).user}catch{me=null}
  drawTabs();draw();pollUnread()}
async function pollUnread(){
  clearInterval(timer);if(!me)return;
  const f=async()=>{try{const d=await api('dm/list');unread=d.chats.reduce((s,c)=>s+(c.unread||0),0);const b=$('#dmdot');if(b){b.textContent=unread||'';b.style.display=unread?'':'none'}}catch{}};
  f();timer=setInterval(f,20000)}
function drawTabs(){
  const t=$('#tabs');t.replaceChildren();
  const add=(id,n,dot)=>{const b=el('button',{class:'btn'+(tab===id?' on':''),onclick:()=>{tab=id;drawTabs();draw()}},n);if(dot)b.append(el('span',{class:'dot',id:'dmdot',style:unread?'':'display:none'},unread||''));t.append(b)};
  add('news','Новости');add('donate','Привилегии');add('shop','Магазин');
  if(me)add('daily','Сундук дня');
  if(me)add('dm','✉️ Сообщения',true);
  if(me)add('stickers','🧩 Стикеры');
  add('acc',me?'👤 Профиль':'🔑 Вход / регистрация');if(me&&me.admin)add('adm','🛠 Админ');
  if(me)t.append(el('button',{class:'btn d',onclick:async()=>{await api('logout','POST',{});me=null;tab='news';clearInterval(timer);drawTabs();draw()}},'Выйти'))}
function draw(){const v=$('#view');v.replaceChildren();({news:drawNews,donate:drawDonate,shop:drawShop,daily:drawDaily,dm:drawDm,stickers:drawStickers,acc:drawAcc,adm:drawAdmin}[tab])(v)}
async function refreshMe(){me=(await api('me')).user;drawTabs()}

async function drawNews(v){
  v.append(el('div',{class:'mut'},'Загрузка…'));
  let d;try{d=await api('news')}catch(e){v.replaceChildren(el('div',{class:'msg e'},e.message));return}
  v.replaceChildren();
  if(me&&!me.admin)v.append(el('div',{class:'card mut'},`За каждое голосование в опросе ты получаешь ${cfg.reward.vote||0} 💎.`));
  if(!d.posts.length)v.append(el('div',{class:'card mut'},'Пока новостей нет.'));
  for(const p of d.posts){
    const c=el('div',{class:'card post'},el('div',{class:'mut'},fmt(p.created)),el('div',{class:'body'},p.body));
    if(p.options.length){
      const total=p.options.reduce((s,o)=>s+o.votes,0);
      for(const o of p.options){
        const pct=total?Math.round(o.votes*100/total):0;
        c.append(el('div',{class:'opt'+(p.myVote===o.id?' me':''),onclick:async()=>{
          if(!me){alert('Войди в аккаунт, чтобы голосовать');return}
          if(p.myVote!=null)return;
          try{const r=await api('vote','POST',{post:p.id,option:o.id});if(r.reward)alert('+'+r.reward+' 💎 за участие в голосовании!');await refreshMe();draw()}catch(e){alert(e.message)}}},
          el('i',{style:`width:${pct}%`}),el('span',{},o.text),el('span',{},`${o.votes} • ${pct}%`)));
      }
      c.append(el('div',{class:'mut',style:'margin-top:8px'},me?(p.myVote!=null?'Ты проголосовал(а). Всего голосов: '+total:'Выбери вариант. Всего голосов: '+total):'Голосовать могут только вошедшие. Всего голосов: '+total));
    }
    if(me&&me.admin)c.append(el('button',{class:'btn sm d',style:'margin-top:10px',onclick:async()=>{if(confirm('Удалить новость?')){await api('news','DELETE',{id:p.id});draw()}}},'Удалить'));
    v.append(c)}}

};

function shrink(file,max,q=.82){return new Promise((res,rej)=>{

    for(let i=0;i<6;i++){const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);
      const d=c.toDataURL('image/jpeg',q);if(d.length<390000)return res(d);w=Math.round(w*.75);h=Math.round(h*.75);q-=.08}
    rej(new Error('Не удалось сжать картинку'))};
  im.onerror=()=>rej(new Error('Не удалось открыть картинку'));im.src=u})}
